<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 24px;
            line-height: 1.5;
            word-break: break-word;
        }
        .action-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }
        .action-btn:hover {
            background-color: var(--accent-hover);
        }
        .status-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 20px;
        }
        .error-message {
            color: #ef4444;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="content">
        <h1 id="media-title" class="title">menyiapkan file...</h1>
        <a id="download-btn" href="#" class="action-btn" style="display: none;">unduh file mp4 sekarang</a>
    </div>
    <div id="error-box"></div>
    <div class="status-text">secure media gateway</div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const sourceUrl = params.get('src');
    const rawTitle = params.get('title');

    const titleEl = document.getElementById('media-title');
    const downloadBtn = document.getElementById('download-btn');
    const contentDiv = document.getElementById('content');
    const errorBox = document.getElementById('error-box');

    if (sourceUrl && rawTitle) {
        const decodedTitle = decodeURIComponent(rawTitle);
        titleEl.textContent = decodedTitle;
        
        downloadBtn.href = sourceUrl;
        downloadBtn.style.display = 'block';
    } else {
        contentDiv.style.display = 'none';
        errorBox.innerHTML = `<div class="error-message">tautan tidak valid atau parameter kedaluwarsa.</div>`;
    }
</script>

</body>
</html>
